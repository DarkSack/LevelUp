# JVM (el almacén de certificados de Windows evita fallos de TLS al descargar dependencias tras un proxy)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT -Djavax.net.ssl.trustStore=NUL
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# Compilación para betatesters: quien la abre recibe para siempre el alebrije, la mascota exclusiva.
# Poner false (o quitar la línea) para la versión pública.
levelup.beta=true
