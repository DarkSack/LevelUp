name: Supabase despierto

# El plan gratis pausa el proyecto tras 7 días sin uso: si los testers no abren la app unos días, la cuenta y lo
# social dejan de funcionar. Esto le hace una consulta mínima (public.ping) cada 3 días.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Latido
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
